# OSC fork CI wrapper - generated by scripts/make_wrapper.py;
# check with scripts/verify_wrapper.py before pushing.
# Jobs kept (verbatim, except the two sanctioned adaptations:
# checkout pinned to ${{ inputs.target_ref }}, and the inserted
# Provenance step):
#   - test
#   - package
#   - release-gate
#   - baseline
#   - action
#   - ci-ok [no checkout step - no Provenance step added, none invented] [keeps its own if: (always()) - evaluated as written on workflow_dispatch too]
# DELIBERATELY EXCLUDED (loud):
#   - none

name: OSC manual CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        persist-credentials: false
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22
    - name: Run npm scripts with Git Bash (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: npm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"
    - run: npm test
      shell: bash
  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        persist-credentials: false
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npx --yes publint@0.3.25 --strict
    - name: Install the packed tarball in an empty project and run it
      run: sh scripts/smoke-tarball.sh
  release-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        persist-credentials: false
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - run: npm ci --ignore-scripts
    - run: npm run build --if-present
    - run: node scripts/release-gate.mjs
  baseline:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22
    - name: No false alarm on a real message, every reachable kind caught
      run: node evals/baseline/run.mjs --commits 200 --check
  action:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.target_ref }}
        persist-credentials: false
        fetch-depth: 0
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - name: A description with the block passes
      id: with-block
      continue-on-error: true
      uses: ./
      with:
        body-file: test/fixtures/with-block.txt
        comment: 'false'
    - name: A description without the block fails
      id: without-block
      continue-on-error: true
      uses: ./
      with:
        body-file: test/fixtures/without-block.txt
        comment: 'false'
    - name: Without the block and warn set, it passes
      id: warned
      continue-on-error: true
      uses: ./
      with:
        body-file: test/fixtures/without-block.txt
        warn: 'true'
        comment: 'false'
    - name: A pr that is not a number fails, even with a description that would pass
      id: bad-pr
      continue-on-error: true
      uses: ./
      with:
        pr: 12a
        body-file: test/fixtures/with-block.txt
        comment: 'false'
    - name: A pull request opened by a dependency bot is skipped
      id: bot
      continue-on-error: true
      uses: ./
      with:
        body-file: test/fixtures/without-block.txt
        author: dependabot[bot]
        comment: 'false'
    - name: A pull request opened by a person is still checked
      id: human
      continue-on-error: true
      uses: ./
      with:
        body-file: test/fixtures/without-block.txt
        author: someone
        comment: 'false'
    - name: The diff and references inputs are accepted
      id: inputs-ok
      continue-on-error: true
      uses: ./
      with:
        body-file: test/fixtures/with-block.txt
        diff: HEAD~1...HEAD
        references: error
        comment: 'false'
    - name: A diff that is a flag is refused
      id: bad-diff
      continue-on-error: true
      uses: ./
      with:
        body-file: test/fixtures/with-block.txt
        diff: --stat
        comment: 'false'
    - name: An unknown references mode is refused
      id: bad-references
      continue-on-error: true
      uses: ./
      with:
        body-file: test/fixtures/with-block.txt
        references: strict
        comment: 'false'
    - name: Each step ended the way it should
      env:
        WITH_BLOCK: ${{ steps.with-block.outcome }}
        WITHOUT_BLOCK: ${{ steps.without-block.outcome }}
        WARNED: ${{ steps.warned.outcome }}
        BAD_PR: ${{ steps.bad-pr.outcome }}
        BOT: ${{ steps.bot.outcome }}
        HUMAN: ${{ steps.human.outcome }}
        INPUTS_OK: ${{ steps.inputs-ok.outcome }}
        BAD_DIFF: ${{ steps.bad-diff.outcome }}
        BAD_REFERENCES: ${{ steps.bad-references.outcome }}
      run: |
        echo "with-block: $WITH_BLOCK (want success)  without-block: $WITHOUT_BLOCK (want failure)  warned: $WARNED (want success)  bad-pr: $BAD_PR (want failure)"
        echo "bot: $BOT (want success)  human: $HUMAN (want failure)  inputs-ok: $INPUTS_OK (want success)  bad-diff: $BAD_DIFF (want failure)  bad-references: $BAD_REFERENCES (want failure)"
        test "$WITH_BLOCK" = success && test "$WITHOUT_BLOCK" = failure && test "$WARNED" = success && test "$BAD_PR" = failure
        test "$BOT" = success && test "$HUMAN" = failure && test "$INPUTS_OK" = success && test "$BAD_DIFF" = failure && test "$BAD_REFERENCES" = failure
  ci-ok:
    if: always()
    needs:
    - test
    - package
    - release-gate
    - baseline
    - action
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo "test: ${{ needs.test.result }}  package: ${{ needs.package.result }}  release-gate: ${{ needs.release-gate.result }}  baseline: ${{ needs.baseline.result }}  action: ${{ needs.action.result }}"
        test "${{ needs.test.result }}" = success && test "${{ needs.package.result }}" = success && test "${{ needs.release-gate.result }}" = success && test "${{ needs.baseline.result }}" = success && test "${{ needs.action.result }}" = success
